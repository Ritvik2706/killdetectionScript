name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libgl1 libegl1
      - run: python -m pip install -e ".[gui,dev,build]"
      - run: python -m pytest -q
      - name: Linux GUI integration
        if: runner.os == 'Linux'
        env:
          KILLCUTTER_GUI_TESTS: '1'
        run: xvfb-run -a python -m pytest tests/test_gui.py -q
      - name: Windows GUI integration
        if: runner.os == 'Windows'
        env:
          KILLCUTTER_GUI_TESTS: '1'
        run: python -m pytest tests/test_gui.py -q
      - run: python tools/build_desktop.py
      - name: Linux packaged launch
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/KillcutterStudio/KillcutterStudio --smoke-test
      - name: Windows packaged launch
        if: runner.os == 'Windows'
        run: dist/KillcutterStudio/KillcutterStudio.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: KillcutterStudio-${{ runner.os }}
          path: dist/KillcutterStudio/
