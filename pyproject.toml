[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "killcutter"
version = "1.0.0"
description = "Detect CoD kills from the ENEMY DOWNED banner and build a Premiere-ready highlight EDL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.21",
    "pytesseract>=0.3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["Pillow>=10"]
build = ["pyinstaller>=6.6"]

[project.scripts]
killcutter = "killcutter.cli:run"

[project.gui-scripts]
killcutter-desktop = "killcutter.gui.__main__:main"

[tool.setuptools.packages.find]
include = ["killcutter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
